# Builds the multiplayer relay's Docker image (relay/Dockerfile) and publishes
# it to the GitHub container registry as ghcr.io/<owner>/fableflight-relay,
# for amd64 and arm64, whenever the relay or its protocol changes on main.
name: Relay image

on:
  push:
    # (multiplayer: the branch it is developed on, until it reaches main)
    branches: [main, multiplayer]
    paths: ["relay/**", "src/mp_proto.rs", ".github/workflows/relay.yml"]
  workflow_dispatch:

permissions:
  contents: read
  packages: write

jobs:
  image:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Relay tests
        run: cd relay && cargo test --release
      - name: Image name (lower case, as the registry wants) and the relay's version
        run: |
          echo "IMAGE=ghcr.io/${GITHUB_REPOSITORY_OWNER,,}/fableflight-relay" >> "$GITHUB_ENV"
          echo "RELAY_VERSION=$(sed -n 's/^version = "\(.*\)"/\1/p' relay/Cargo.toml | head -n 1)" >> "$GITHUB_ENV"
      - uses: docker/setup-qemu-action@v3
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: docker/build-push-action@v6
        with:
          context: .
          file: relay/Dockerfile
          platforms: linux/amd64,linux/arm64
          push: true
          tags: |
            ${{ env.IMAGE }}:latest
            ${{ env.IMAGE }}:${{ github.sha }}
            ${{ env.IMAGE }}:${{ env.RELAY_VERSION }}
