<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>FableFlight · Multiplayer</title>
<style>
  :root { --bg: #0b0f15; --panel: #141a23; --line: #232c39; --text: #e6e9ee; --dim: #8a94a3; --accent: #ffc53d; --ok: #6fdc8c; --bad: #ff7a5c; }
  @media (prefers-color-scheme: light) { :root { --bg: #f4f5f7; --panel: #fff; --line: #e1e4ea; --text: #161a20; --dim: #5d6573; --accent: #b77d00; --ok: #1d8a41; --bad: #c4401f; } }
  * { box-sizing: border-box; }
  body { margin: 0; background: var(--bg); color: var(--text); font: 15px/1.45 system-ui, -apple-system, "Segoe UI", sans-serif; }
  main { max-width: 860px; margin: 0 auto; padding: 32px 16px 48px; }
  h1 { font-size: 13px; letter-spacing: .28em; color: var(--accent); margin: 0 0 6px; font-weight: 600; }
  .big { display: flex; align-items: baseline; gap: 14px; margin: 18px 0 6px; }
  .big b { font-size: 64px; font-weight: 650; line-height: 1; font-variant-numeric: tabular-nums; }
  .big span { color: var(--dim); font-size: 18px; }
  .meta { color: var(--dim); font-size: 13px; display: flex; flex-wrap: wrap; gap: 6px 18px; }
  .dot { display: inline-block; width: 8px; height: 8px; border-radius: 50%; background: var(--ok); margin-right: 6px; vertical-align: 1px; }
  .dot.off { background: var(--bad); }
  .card { background: var(--panel); border: 1px solid var(--line); border-radius: 10px; margin-top: 10px; overflow-x: auto; }
  h2 { font-size: 12px; letter-spacing: .14em; text-transform: uppercase; color: var(--dim); font-weight: 600; margin: 28px 0 0; }
  .here { color: var(--accent); font-size: 11px; margin-left: 6px; }
  table { width: 100%; border-collapse: collapse; font-variant-numeric: tabular-nums; }
  th, td { text-align: left; padding: 10px 14px; border-bottom: 1px solid var(--line); white-space: nowrap; }
  th { color: var(--dim); font-weight: 500; font-size: 12px; text-transform: uppercase; letter-spacing: .06em; }
  tr:last-child td { border-bottom: 0; }
  td.n { text-align: right; } th.n { text-align: right; }
  .empty { padding: 26px 14px; color: var(--dim); text-align: center; }
  footer { margin-top: 26px; color: var(--dim); font-size: 12px; }
  a { color: var(--accent); }
  #map { display: block; width: 100%; height: auto; }
  .attr { padding: 6px 14px; font-size: 11px; color: var(--dim); text-align: right; border-top: 1px solid var(--line); }
  td.pos a { text-decoration: none; }
</style>
</head>
<body>
<main>
  <h1 id="title">FABLEFLIGHT · MULTIPLAYER</h1>
  <div class="big"><b id="count">–</b><span id="label">pilots flying</span></div>
  <div class="meta"><span><span id="dot" class="dot off"></span><span id="state">connecting…</span></span><span id="uptime"></span><span id="limits"></span></div>
  <h2 id="h-servers">Servers</h2>
  <div class="card">
    <table>
      <thead><tr><th id="h-srv">Server</th><th id="h-st">Status</th><th class="n" id="h-np">Pilots</th></tr></thead>
      <tbody id="servers"></tbody>
    </table>
  </div>
  <div id="map-wrap" hidden>
    <h2 id="h-map">Map</h2>
    <div class="card"><canvas id="map" width="1024" height="560"></canvas><div class="attr">© <a href="https://www.openstreetmap.org/copyright">OpenStreetMap</a> contributors</div></div>
  </div>
  <h2 id="h-pilots">Pilots</h2>
  <div class="card">
    <table>
      <thead><tr><th id="h-name">Pilot</th><th id="h-relay">Server</th><th id="h-ac">Aircraft</th><th class="n" id="h-alt">Altitude</th><th class="n" id="h-spd">Speed</th><th class="pos" id="h-pos" hidden>Position</th><th class="n" id="h-hdg" hidden>Heading</th></tr></thead>
      <tbody id="rows"></tbody>
    </table>
    <div class="empty" id="empty" hidden>Nobody in the air right now.</div>
  </div>
  <footer><span id="foot">Updated every two seconds. Positions are not shown.</span> · <a href="https://github.com/Rolandjg/fableflight">FableFlight</a></footer>
</main>
<script>
"use strict";
const fr = (navigator.language || "").toLowerCase().startsWith("fr");
const T = fr ? {
  label: n => n === 1 ? "pilote en vol" : "pilotes en vol", connecting: "connexion…", live: "en direct", down: "relais injoignable",
  servers: "Serveurs", pilots: "Pilotes", srv: "Serveur", st: "État", np: "Pilotes", on: "en ligne", off: "injoignable", here: "ce serveur",
  net: (n, up) => up + " serveur" + (up > 1 ? "s" : "") + " en ligne sur " + n,
  name: "Pilote", ac: "Avion", alt: "Altitude", spd: "Vitesse", empty: "Personne en vol pour le moment.",
  foot: "Mis à jour toutes les deux secondes. Les positions ne sont pas affichées.", ground: "au sol",
  footPos: "Mis à jour toutes les deux secondes. Positions à environ un kilomètre près.", map: "Carte", pos: "Position", hdg: "Cap",
  ns: v => v >= 0 ? "N" : "S", ew: v => v >= 0 ? "E" : "O",
  up: s => "en service depuis " + dur(s), lim: (m, r) => m + " pilotes max · visibles à " + r + " km"
} : {
  label: n => n === 1 ? "pilot flying" : "pilots flying", connecting: "connecting…", live: "live", down: "relay unreachable",
  servers: "Servers", pilots: "Pilots", srv: "Server", st: "Status", np: "Pilots", on: "online", off: "unreachable", here: "this server",
  net: (n, up) => up + " of " + n + " server" + (n > 1 ? "s" : "") + " online",
  name: "Pilot", ac: "Aircraft", alt: "Altitude", spd: "Speed", empty: "Nobody in the air right now.",
  foot: "Updated every two seconds. Positions are not shown.", ground: "on the ground",
  footPos: "Updated every two seconds. Positions to about a kilometre.", map: "Map", pos: "Position", hdg: "Heading",
  ns: v => v >= 0 ? "N" : "S", ew: v => v >= 0 ? "E" : "W",
  up: s => "up for " + dur(s), lim: (m, r) => "up to " + m + " pilots · seen within " + r + " km"
};
if (fr) document.documentElement.lang = "fr";
function dur(s) {
  const d = Math.floor(s / 86400), h = Math.floor(s % 86400 / 3600), m = Math.floor(s % 3600 / 60);
  return d ? d + " j " + h + " h" : h ? h + " h " + m + " min" : m + " min";
}
const $ = id => document.getElementById(id);
$("h-servers").textContent = T.servers; $("h-pilots").textContent = T.pilots; $("h-srv").textContent = T.srv; $("h-st").textContent = T.st; $("h-np").textContent = T.np; $("h-relay").textContent = T.srv;
$("h-name").textContent = T.name; $("h-ac").textContent = T.ac; $("h-alt").textContent = T.alt; $("h-spd").textContent = T.spd;
$("empty").textContent = T.empty; $("foot").textContent = T.foot; $("state").textContent = T.connecting;
$("h-map").textContent = T.map; $("h-pos").textContent = T.pos; $("h-hdg").textContent = T.hdg;

// The map: OpenStreetMap's tiles at zoom 2 (Web Mercator, 1024 px across),
// from 75° N to 60° S, and each pilot as a small arrow along their heading.
const Z = 2, WORLD = 256 << Z, TOP = 75, BOTTOM = -60;
const merc = lat => { const s = Math.sin(lat * Math.PI / 180); return (0.5 - Math.log((1 + s) / (1 - s)) / (4 * Math.PI)) * WORLD; };
const Y0 = merc(TOP), Y1 = merc(BOTTOM);
const map = $("map"), ctx = map.getContext("2d");
map.height = Math.round(Y1 - Y0);
const tiles = [];
let last = [];
function loadTiles() {
  if (tiles.length) return;
  for (let y = 0; y < 1 << Z; y++) for (let x = 0; x < 1 << Z; x++) {
    if ((y + 1) * 256 < Y0 || y * 256 > Y1) continue;
    const img = new Image();
    img.onload = () => draw(last);
    img.src = "https://tile.openstreetmap.org/" + Z + "/" + x + "/" + y + ".png";
    tiles.push({ x, y, img });
  }
}
const dark = () => window.matchMedia("(prefers-color-scheme: dark)").matches;
function draw(players) {
  last = players;
  const css = getComputedStyle(document.documentElement);
  ctx.fillStyle = css.getPropertyValue("--panel"); ctx.fillRect(0, 0, map.width, map.height);
  ctx.save();
  ctx.filter = dark() ? "invert(1) hue-rotate(180deg) brightness(0.75) contrast(0.9)" : "saturate(0.6)";
  for (const t of tiles) if (t.img.complete && t.img.naturalWidth) ctx.drawImage(t.img, t.x * 256, t.y * 256 - Y0);
  ctx.restore();
  const accent = css.getPropertyValue("--accent"), dim = css.getPropertyValue("--dim");
  ctx.font = "600 13px system-ui, sans-serif"; ctx.textBaseline = "middle";
  for (const p of players) {
    if (p.lat === undefined) continue;
    const x = (p.lon + 180) / 360 * WORLD, y = merc(Math.max(-85, Math.min(85, p.lat))) - Y0;
    ctx.save(); ctx.translate(x, y); ctx.rotate(p.heading * Math.PI / 180);
    ctx.beginPath(); ctx.moveTo(0, -9); ctx.lineTo(6, 7); ctx.lineTo(0, 3); ctx.lineTo(-6, 7); ctx.closePath();
    ctx.fillStyle = p.on_ground ? dim : accent; ctx.fill();
    ctx.lineWidth = 1.5; ctx.strokeStyle = "rgba(0,0,0,.6)"; ctx.stroke();
    ctx.restore();
    ctx.lineWidth = 3; ctx.strokeStyle = dark() ? "rgba(0,0,0,.75)" : "rgba(255,255,255,.85)";
    ctx.strokeText(p.name, x + 11, y); ctx.fillStyle = css.getPropertyValue("--text"); ctx.fillText(p.name, x + 11, y);
  }
}
function where(p) {
  const td = document.createElement("td"); td.className = "pos";
  const a = document.createElement("a");
  a.href = "https://www.openstreetmap.org/?mlat=" + p.lat + "&mlon=" + p.lon + "#map=10/" + p.lat + "/" + p.lon;
  a.target = "_blank"; a.rel = "noopener";
  a.textContent = Math.abs(p.lat).toFixed(2) + "° " + T.ns(p.lat) + ", " + Math.abs(p.lon).toFixed(2) + "° " + T.ew(p.lon);
  td.appendChild(a); return td;
}
function cell(tr, text, num) { const td = document.createElement("td"); td.textContent = text; if (num) td.className = "n"; tr.appendChild(td); }
async function tick() {
  try {
    const r = await fetch("status.json", { cache: "no-store" });
    const s = await r.json();
    $("title").textContent = "FABLEFLIGHT · " + s.relay.toUpperCase(); document.title = "FableFlight · " + s.relay;
    $("count").textContent = s.flying;
    $("label").textContent = T.label(s.flying);
    $("dot").className = "dot"; $("state").textContent = T.live;
    $("uptime").textContent = T.up(s.uptime_s);
    $("limits").textContent = T.net(s.network.length, s.network.filter(n => n.up).length) + " · " + T.lim(s.max_players, s.range_km);
    const sv = $("servers"); sv.replaceChildren();
    for (const n of s.network) {
      const tr = document.createElement("tr");
      const td = document.createElement("td"); td.textContent = n.name;
      if (n.self) { const h = document.createElement("span"); h.className = "here"; h.textContent = T.here; td.appendChild(h); }
      tr.appendChild(td);
      const st = document.createElement("td"); const dot = document.createElement("span"); dot.className = n.up ? "dot" : "dot off";
      st.appendChild(dot); st.appendChild(document.createTextNode(n.up ? T.on : T.off)); tr.appendChild(st);
      cell(tr, n.up ? n.flying : "–", true);
      sv.appendChild(tr);
    }
    const rows = $("rows"); rows.replaceChildren();
    for (const p of s.players) {
      const tr = document.createElement("tr");
      cell(tr, p.name); cell(tr, p.relay); cell(tr, p.aircraft);
      cell(tr, p.on_ground ? T.ground : Math.round(p.alt_ft).toLocaleString() + " ft", true);
      cell(tr, Math.round(p.speed_kt) + " kt", true);
      if (s.positions && p.lat !== undefined) {
        tr.appendChild(where(p));
        cell(tr, String(Math.round(p.heading) % 360).padStart(3, "0") + "°", true);
      }
      rows.appendChild(tr);
    }
    $("empty").hidden = s.players.length > 0;
    // (Positions only where the relay's operator chose to show them.)
    const pos = !!s.positions;
    $("map-wrap").hidden = !pos; $("h-pos").hidden = !pos; $("h-hdg").hidden = !pos;
    $("foot").textContent = pos ? T.footPos : T.foot;
    if (pos) { loadTiles(); draw(s.players); }
  } catch (e) {
    $("dot").className = "dot off"; $("state").textContent = T.down;
  }
}
tick(); setInterval(tick, 2000);
</script>
</body>
</html>
